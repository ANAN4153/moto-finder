function ui(){const current={scenario:$('scenario').value,profile:$('profile').value,commute:$('commute').value,brand:$('brand').value,ccClass:$('ccClass').value,sort:$('sort').value,budgetMin:$('budgetMin').value,budgetMax:$('budgetMax').value};const brands=[...new Set(bikes.map(b=>b.brand))].sort();$('scenario').innerHTML=`<option value="all">${tr().scenarioAll}</option><option value="race">${tr().scRace}</option><option value="daily">${tr().scDaily}</option><option value="short">${tr().scShort}</option><option value="long">${tr().scLong}</option><option value="city">${tr().scCity}</option><option value="suburb">${tr().scSuburb}</option>`;$('profile').innerHTML=`<option value="student">${tr().profileStudent}</option><option value="office">${tr().profileOffice}</option><option value="commute">${tr().profileCommute}</option><option value="sport">${tr().profileSport}</option>`;$('commute').innerHTML=`<option value="any">${tr().commuteAny}</option><option value="short">${tr().commuteShort}</option><option value="medium">${tr().commuteMedium}</option><option value="long">${tr().commuteLong}</option>`;$('brand').innerHTML=`<option value="all">${tr().brandAll}</option>`+brands.map(b=>`<option value="${b}">${brandName(b)}</option>`).join('');$('ccClass').innerHTML='<option value="all">'+tr().ccClassAll+'</option><option value="light">'+tr().ccLight+'</option><option value="ordinary">'+tr().ccOrdinary+'</option><option value="yellow">'+tr().ccYellow+'</option><option value="red">'+tr().ccRed+'</option>';$('sort').innerHTML='<option value="economy">'+tr().sortEconomy+'</option><option value="cc">'+tr().sortCc+'</option><option value="ccDesc">'+tr().sortCcDesc+'</option><option value="price">'+tr().sortPrice+'</option><option value="priceDesc">'+tr().sortPriceDesc+'</option>';for(const id of ['eyebrow','title','intro','notice','formTitle','formSub','typeLabel','scenarioLabel','scenarioHint','profileLabel','commuteLabel','commuteHint','brandLabel','searchLabel','ccLabel','budgetLabel','budgetMinLabel','budgetMaxLabel','budgetHint','sortLabel','apply','reset','resultsTitle','resultExplain','aiDisclosure','footer'])$(id).innerHTML=tr()[id]||'';$('title').textContent=tr().title;$('langBtn').textContent=lang==='zh'?'English':'繁體中文';$('search').placeholder=tr().searchHint;$('types').innerHTML=[['all',tr().typeAll],['scooter',tr().scooter],['manual',tr().manual]].map(([v,l])=>`<button type="button" data-type="${v}" class="${type===v?'active':''}">${l}</button>`).join('');$('types').querySelectorAll('button').forEach(b=>b.onclick=()=>{type=b.dataset.type;shown=24;ui()});$('scenario').value=current.scenario||'all';$('brand').value=current.brand||'all';$('ccClass').value=current.ccClass||'all';$('sort').value=['economy','cc','ccDesc','price','priceDesc'].includes(current.sort)?current.sort:'economy';$('budgetMin').value=current.budgetMin||'';$('budgetMax').value=current.budgetMax||'';$('profile').value=current.profile||profile;$('commute').value=current.commute||commute;render()}
function nKnown(b){return [b.displacement_cc,b.power_ps,b.torque_nm,b.fuel_economy_km_per_l_min,b.length_mm&&b.width_mm&&b.height_mm?1:null].filter(v=>v!==null&&v!==undefined).length}
function scenarioTags(b){const cc=b.displacement_cc,p=b.power_ps,manual=b.category==='manual',scooter=b.category==='scooter',name=b.model||'',sportName=/(ninja|cbr|gsx[- ]?r|zx[- ]|yzf|r[0-9]{2,}|rr|rc|racing|supersport)/i.test(name),tags=[];if(sportName||(p!==null&&p>=15))tags.push('race');if((scooter&&cc!==null&&cc<=250)||(manual&&cc!==null&&cc<=200))tags.push('daily');if(cc!==null&&cc<=300)tags.push('short');if(cc!==null&&cc>=250)tags.push('long');if((scooter&&cc!==null&&cc<=200)||(manual&&cc!==null&&cc<=150))tags.push('city');if(cc!==null&&cc>=125&&cc<=500)tags.push('suburb');return tags}
function scenarioLabel(key){return tr()[{race:'scRace',daily:'scDaily',short:'scShort',long:'scLong',city:'scCity',suburb:'scSuburb'}[key]||'scenarioAll']}
function recommendationScore(b){const price=b.price_min_twd,hasPrice=price!==null&&price!==undefined,hasFuel=b.fuel_economy_km_per_l_min!==null&&b.fuel_economy_km_per_l_min!==undefined,hasPower=b.power_ps!==null&&b.power_ps!==undefined,hasTorque=b.torque_nm!==null&&b.torque_nm!==undefined;let priceScore=50;if(hasPrice){const budget=Number($('budgetMax').value)||Number($('budgetMin').value)||null;if(budget)priceScore=Math.max(0,100*(1-price/budget));else{const prices=bikes.map(x=>x.price_min_twd).filter(x=>x!==null&&x!==undefined),lo=Math.min(...prices),hi=Math.max(...prices);priceScore=hi===lo?50:100*(1-(price-lo)/(hi-lo))}}const fuelScore=hasFuel?Math.max(0,Math.min(100,(b.fuel_economy_km_per_l_min-20)/35*100)):50;const powerScore=hasPower?Math.max(0,Math.min(100,b.power_ps/30*100)):50;const torqueScore=hasTorque?Math.max(0,Math.min(100,b.torque_nm/60*100)):50;let w={price:.3,economy:.5,power:.2};if(profile.value==='student')w={price:.48,economy:.42,power:.1};if(profile.value==='commute')w={price:.25,economy:.6,power:.15};if(profile.value==='sport')w={price:.12,economy:.16,power:.72};const dist=$('commute').value;if(dist==='medium'){w.economy+=.08;w.price-=.04;w.power-=.04}if(dist==='long'){w.economy+=.16;w.price-=.08;w.power-=.08}return Math.round(priceScore*w.price+fuelScore*w.economy+((powerScore+torqueScore)/2)*w.power)}function matchesPlateClass(cc,kind){if(cc===null||cc===undefined)return false;if(kind==='light')return cc<=50;if(kind==='ordinary')return cc>50&&cc<=250;if(kind==='yellow')return cc>250&&cc<=550;if(kind==='red')return cc>550;return true} function filter(){let scenario=$('scenario').value,ccClass=$('ccClass').value,budgetMin=Number($('budgetMin').value)||null,budgetMax=Number($('budgetMax').value)||null,q=$('search').value.trim().toLowerCase();let a=bikes.filter(b=>{if(type!=='all'&&b.category!==type)return false;if(scenario!=='all'&&!scenarioTags(b).includes(scenario))return false;if($('brand').value!=='all'&&b.brand!==$('brand').value)return false;if(q&&!`${b.model} ${b.brand} ${brandZh[b.brand]||''}`.toLowerCase().includes(q))return false;if(ccClass!=='all'&&!matchesPlateClass(b.displacement_cc,ccClass))return false;if((budgetMin!==null||budgetMax!==null)&&(b.price_min_twd===null||b.price_min_twd===undefined))return false;if(budgetMin!==null&&b.price_min_twd<budgetMin)return false;if(budgetMax!==null&&b.price_min_twd>budgetMax)return false;return true});let sort=$('sort').value;if(sort==='economy')a.sort((x,y)=>(y.fuel_economy_km_per_l_max??-1)-(x.fuel_economy_km_per_l_max??-1));else if(sort==='cc')a.sort((x,y)=>(x.displacement_cc??Infinity)-(y.displacement_cc??Infinity));else if(sort==='ccDesc')a.sort((x,y)=>(y.displacement_cc??-Infinity)-(x.displacement_cc??-Infinity));else if(sort==='price')a.sort((x,y)=>(x.price_min_twd??Infinity)-(y.price_min_twd??Infinity));else if(sort==='priceDesc')a.sort((x,y)=>(y.price_min_twd??-Infinity)-(x.price_min_twd??-Infinity));return a}
function spec(label,value){return `<div class="spec"><small>${label}</small><b>${value}</b></div>`}function priceLabel(b){if(b.price_min_twd===null||b.price_min_twd===undefined)return '—';const lo='NT$ '+fmt(b.price_min_twd,0),hi='NT$ '+fmt(b.price_max_twd,0);if(b.price_type==='starting')return `${lo} ${tr().priceStarting==='起價'?'起':'from'}`;if(b.price_type==='estimate')return `${lang==='zh'?'約 ':'Approx. '}${lo}`;if(b.price_type==='pending')return `${lo} · ${tr().pricePending}`;if(b.price_min_twd!==b.price_max_twd)return `${lo}–${hi} · ${tr()[b.price_type==='mixed'?'priceMixed':'priceVariant']}`;return lo}function card(b){let p=b.power_ps===null?'—':`${fmt(b.power_ps)} PS${b.power_rpm?` @ ${fmt(b.power_rpm,0)} rpm`:''}`,t=b.torque_nm===null?'—':`${fmt(b.torque_nm)} N·m${b.torque_rpm?` @ ${fmt(b.torque_rpm,0)} rpm`:''}`,dims=[b.length_mm,b.width_mm,b.height_mm].every(x=>x!==null)?`${fmt(b.length_mm,0)} × ${fmt(b.width_mm,0)} × ${fmt(b.height_mm,0)} mm`:'—',e=b.fuel_economy_km_per_l_min===null?'—':`${fmt(b.fuel_economy_km_per_l_min)}${b.fuel_economy_km_per_l_max!==b.fuel_economy_km_per_l_min?`–${fmt(b.fuel_economy_km_per_l_max)}`:''} km/L`,version=b.year_or_version||'—',tags=scenarioTags(b),aiBadge=`<div class="feature"><strong>${tr().aiScore}：${recommendationScore(b)}/100</strong></div>`,tagHtml=tags.length?`<div class="feature"><strong>${tr().scenarioTags}：</strong>${tags.map(k=>`<span class="tag">${scenarioLabel(k)}</span>`).join(' ')}</div>`:'',features=b.raw?.features||'—',featureDisplay=lang==='en'&&features!=='—'?`${features} <span>(${tr().features})</span>`:features;return `<article class="bike"><div class="bike-top"><div><h3>${b.model}</h3><div class="maker">${brandName(b.brand)}</div></div><span class="tag">${categoryName(b.category)}</span></div><div class="version">${tr().version}：${version}</div><div class="specs">${spec(tr().price,priceLabel(b))}${spec(tr().disp,`${fmt(b.displacement_cc,1)}${b.displacement_cc===null?'':' cc'}`)}${spec(tr().power,p)}${spec(tr().torque,t)}${spec(tr().dims,dims)}${spec(tr().economy,e)}${spec(tr().completeness(nKnown(b)),`${nKnown(b)}/5`)}</div>${aiBadge}${tagHtml}${b.fuel_economy_note_zh?`<div class="feature"><strong>${lang==='zh'?'油耗來源':'Fuel economy source'}：</strong>${lang==='zh'?b.fuel_economy_note_zh:b.fuel_economy_note_en} <a href="${b.fuel_economy_source}" target="_blank" rel="noopener noreferrer">${lang==='zh'?'能源署查詢':'Energy Administration'}</a></div>`:''}${features==='—'?'':`<div class="feature"><strong>${tr().features}：</strong>${featureDisplay}</div>`}<div class="source"><strong>${tr().source}：</strong>${b.source_pdf||'—'}${b.source_page?` · ${tr().page} ${b.source_page}`:''}${b.price_source_page?`<br><strong>${tr().priceSource}：</strong>${tr().page} ${b.price_source_page}`:''}</div></article>`}
function render(){const all=filter(),visible=all.slice(0,shown);$('count').textContent=tr().count(all.length);$('cards').innerHTML=visible.length?visible.map(card).join(''):`<div class="empty">${tr().empty}</div>`;$('more').textContent=shown<all.length?tr().more(Math.min(24,all.length-shown)):tr().allShown;$('more').disabled=shown>=all.length;$('more').style.opacity=shown>=all.length?'.6':'1'}
$('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';ui()};$('apply').onclick=()=>{shown=24;render()};$('reset').onclick=()=>{$('scenario').value='all';$('brand').value='all';$('search').value='';$('ccClass').value='all';$('budgetMin').value='';$('budgetMax').value='';$('sort').value='economy';profile='office';commute='medium';type='all';shown=24;ui()};$('more').onclick=()=>{shown+=24;render()};['scenario','profile','commute','brand','ccClass','sort','budgetMin','budgetMax'].forEach(id=>$(id).onchange=()=>{shown=24;render()});$('search').oninput=()=>{shown=24;render()};ui();
</script>
